<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>超菜鸡 - 苏泊尔小C主厨机菜谱站</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <h1>超菜鸡 🐔</h1>
  <p class="subtitle">苏泊尔小C主厨机 · 菜谱站（菜名与机器内一字不差，直接搜）</p>
  <input id="search" type="search" placeholder="搜菜名，比如：排骨 / 鸡翅 / 牛肉…" autocomplete="off">
</header>

<main>
  <!-- 列表视图：树状竖列，只有菜名 -->
  <div id="list-view">
    <section aria-label="做过的菜">
      <h2 class="section-title"><span class="badge-exp">有经验</span> 做过的菜 <span id="tried-count" class="count"></span></h2>
      <div class="tree" id="tried-list"></div>
    </section>

    <section aria-label="还没做的菜">
      <h2 class="section-title">还没做的 <span id="todo-count" class="count"></span></h2>
      <p class="principle">💡 灵活原则：菜谱是活的，有什么用什么 —— 排骨↔鸡腿/带皮鸡胸肉、鸡翅→带皮鸡胸肉、没米饭→土豆当主食。</p>
      <div class="tree" id="dish-list"></div>
      <p id="no-result" hidden>没找到这道菜，换个关键词试试。</p>
    </section>
  </div>

  <!-- 详情视图：点菜名进来才看 -->
  <div id="detail-view" hidden>
    <p class="back-row"><a href="#" id="back-link">← 返回菜谱列表</a></p>
    <article class="dish-card" id="detail-card"></article>
  </div>
</main>

<div id="lightbox" hidden>
  <img id="lightbox-img" alt="菜谱截图放大">
</div>

<footer>
  <p>超菜鸡 · 菜名与主厨机 App 内一字不差</p>
</footer>

<script src="app.js"></script>
</body>
</html>
